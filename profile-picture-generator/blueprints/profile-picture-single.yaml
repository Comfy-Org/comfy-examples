output_prefix: outputs/profile-picture
pipeline:
  - fragment: profile-picture
    alias: avatar
    inputs:
      nano_banana_2_model_images_image_1: $asset.sample-person.png
    params:
      nano_banana_2_model: Nano Banana 2 Lite
      nano_banana_2_model_aspect_ratio: "1:1"
      nano_banana_2_model_resolution: 1K
      nano_banana_2_model_thinking_level: MINIMAL
      nano_banana_2_prompt: A square profile portrait preserving the person's face and identity from the reference.
      nano_banana_2_response_modalities: IMAGE
      nano_banana_2_seed: 2026092201
      nano_banana_2_system_prompt: Create one polished profile picture based on the reference image and prompt.
      nano_banana_2_temperature: 0.8
      nano_banana_2_top_p: 0.9
